<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <h1 class="mb-4">Cadastro de Produtos</h1>

    <div class="card p-4 mb-4">

        <h3 id="formTitle" class="mb-3">Adicionar Produto</h3>

        <input type="hidden" id="productId">

        <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" id="name" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Preço</label>
            <input type="number" id="price" class="form-control" step="0.01">
        </div>

        <div class="d-flex gap-2">
            <button id="saveButton" class="btn btn-primary" onclick="saveProduct()">
                Salvar
            </button>

            <button class="btn btn-secondary" onclick="clearForm()">
                Cancelar
            </button>
        </div>
    </div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Preço</th>
            <th>Ações</th>
        </tr>
        </thead>

        <tbody id="productTable"></tbody>
    </table>

</div>

<!-- modal de confirmação de exclusão -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Excluir Produto</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                Tem certeza que deseja excluir este produto?
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Cancelar
                </button>

                <button type="button" id="confirmDeleteButton" class="btn btn-danger">
                    Excluir
                </button>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
